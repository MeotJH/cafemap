repos:
  - repo: local
    hooks:
      - id: python-text-sanity
        name: python text sanity
        entry: python back/scripts/check_python_text_sanity.py
        language: python
        files: ^back/.*\.py$

      - id: black
        name: black
        entry: python -m black
        language: python
        additional_dependencies:
          - black==26.5.1
        files: ^back/.*\.py$

      - id: ruff
        name: ruff
        entry: python -m ruff check
        language: python
        additional_dependencies:
          - ruff==0.12.1
        files: ^back/.*\.py$

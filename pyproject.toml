[tool.black]
line-length = 88
target-version = ["py310"]
extend-exclude = """
(
  /back/venv
  | /back/node_modules
)
"""

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = [
  "back/venv",
  "back/node_modules",
]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
]
ignore = [
  "E402",
  "E501",
]
